[package]
name = "reciteai"
version = "0.1.0"
description = "ReciteAI — Manuscript Citation Auditor (Desktop)"
edition = "2021"

# ─────────────────────────────────────────────────────────────────────────────
# § BUILD — Tauri requires a lib target for the main app + optional bin
# ─────────────────────────────────────────────────────────────────────────────

[lib]
name = "reciteai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "reciteai"
path = "src/main.rs"

# ─────────────────────────────────────────────────────────────────────────────
# § DEPENDENCIES
# ─────────────────────────────────────────────────────────────────────────────

[dependencies]
tauri            = { version = "2", features = [] }
tauri-plugin-stronghold = "2"
tauri-plugin-window-state = "2"

# Argon2 for Stronghold password hashing (OWASP-recommended KDF)
argon2           = "0.5"

serde            = { version = "1", features = ["derive"] }
serde_json       = "1"

# Zotero SQLite bridge
rusqlite         = { version = "0.31", features = ["bundled"] }

# High-speed local PDF text extraction
pdf-extract      = "0.7"
tauri-plugin-dialog = "2.0.0-rc.0"
tauri-plugin-fs = "2.0.0-rc.0"

[build-dependencies]
tauri-build      = { version = "2", features = [] }

[profile.release]
# Maximum binary hardening for distribution
panic   = "abort"   # Remove stack-unwind tables (reduces binary surface)
codegen-units = 1   # Full LTO compatibility
strip   = true      # Remove debug symbols from distribution binary
